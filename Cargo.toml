[package]
name = "app_esp32s3"
version = "0.1.0"
authors = ["Searchstars <searchstars@163.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "app_esp32s3"
harness = false

[profile.release]
opt-level = "s"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
codegen-units = 1
debug = true

[dependencies]
log = "0.4"
anyhow = "1.0"
esp-idf-svc = { version = "0.51" }
mipidsi = "0.9.0"
display-interface-spi = "0.5.0"
cst816s = "1.0.1"
embedded-graphics = "0.8"

[build-dependencies]
embuild = "0.33"
