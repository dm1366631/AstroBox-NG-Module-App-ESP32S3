[package]
name = "app_esp32s3"
version = "0.1.0"
authors = ["Searchstars <searchstars@163.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "app_esp32s3"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
# Use opt-level=1 instead of "s" to avoid Xtensa LLVM backend crash
# (PCREL_WRAPPER TargetConstantPool float constants cannot be selected).
opt-level = 1
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
codegen-units = 1
debug = true

[features]
default = ["sdcard", "repo_net", "mi_account"]
sdcard = ["embedded-svc"]
repo_net = ["csv", "serde", "serde_json", "url"]
mi_account = ["serde", "serde_json", "md-5", "hmac", "sha1", "sha2", "base64"]
# 步骤 6：AstroBox 插件运行时。默认关闭，避免影响出货固件编译尺寸/稳定性。
# 开启后：SD 卡 `.abp` 可被列出并加载（Phase 1 为 stub runtime，不真正执行 wasm）。
plugin_runtime = ["zip", "serde", "serde_json"]
# 无屏用户的网页控制台：ESP32 内嵌 HTTPd + 编译期嵌入前端单页。
# 依赖 serde/serde_json（repo_net 或 mi_account 或 plugin_runtime 任意一个已开就有），
# 但显式开一次，保证独立使用也 OK。
webui = ["serde", "serde_json"]

experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
anyhow = "1.0.99"
futures-lite = "2.6.1"
esp-idf-svc = { version = "0.51" }
esp32-nimble = "0.11.1"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "fs",
] }

corelib = { path = "../core" }
libc = "0.2"
# Disable simd feature on tiny-skia to avoid Xtensa LLVM backend crash
# (PCREL_WRAPPER TargetConstantPool cannot be selected)

# ============ 新增：SD 卡 / HTTP / 仓库索引 / 日志 依赖 ============
embedded-svc = { version = "0.27", default-features = false, optional = true }
csv = { version = "1.3", optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
url = { version = "2.5", optional = true }

# ============ 步骤 4：小米账号 OAuth 签名所需 ============
# md-5：密码 MD5 哈希；hmac+sha1：登录请求 _sign 签名；
# sha2：device_list 签名 HMAC-SHA256；base64：ssecurity / nonce 编码
md-5 = { version = "0.10", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
sha1 = { version = "0.10", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"], optional = true }

# ============ 步骤 6：AstroBox 插件 .abp 包解包 ============
# zip：解 `.abp`（标准 ZIP）。default-features=false 仅开 deflate（纯 Rust
# miniz_oxide 后端），避开 bzip2/aes 的 C 依赖，确保 Xtensa 可交叉编译。
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[build-dependencies]
embuild = "0.33"
