name: Build ESP32-S3 Firmware (MINIMAL)
on:
  push:
    branches: [minimal]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip libssl-dev libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install espup and ldproxy
        run: cargo +stable install espup ldproxy --locked

      - name: Install ESP32-S3 toolchain
        run: espup install --targets esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release firmware
        run: |
          . $HOME/export-esp.sh
          cd $GITHUB_WORKSPACE
          cargo build --release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-minimal
          path: target/xtensa-esp32s3-espidf/release/app_esp32s3
          retention-days: 30
