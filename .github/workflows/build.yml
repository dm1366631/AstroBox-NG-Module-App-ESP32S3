name: Build ESP32-S3 Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip libssl-dev libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install espup and ldproxy
        run: cargo +stable install espup ldproxy --locked

      - name: Install ESP32-S3 toolchain
        run: espup install --targets esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone dependency modules
        run: |
          cd $GITHUB_WORKSPACE/..
          git clone https://github.com/AstralSightStudios/AstroBox-NG-Module-Core.git core
          git clone https://github.com/AstralSightStudios/AstroBox-NG-Module-Pb.git pb
          git clone https://github.com/AstralSightStudios/AstroBox-NG-Module-Vivo-MsgPack.git vivo_msgpack

      - name: Fix Cargo.toml (remove non-existent features)
        run: |
          cd $GITHUB_WORKSPACE
          sed -i 's/sdcard = \["esp-idf-svc\/fatfs", "esp-idf-svc\/sdmmc", "embedded-svc"\]/sdcard = ["embedded-svc"]/' Cargo.toml

      - name: Patch memmap2 for ESP-IDF (use stub instead of unix mmap)
        run: |
          . $HOME/export-esp.sh
          cd $GITHUB_WORKSPACE
          cargo fetch
          MEMMAP2_DIR=$(find ~/.cargo/registry/src -type d -name "memmap2-0.9*" | head -1)
          echo "Patching memmap2 at: $MEMMAP2_DIR"
          cp "$GITHUB_WORKSPACE/.github/stubs/unix.rs" "$MEMMAP2_DIR/src/unix.rs"
          cp "$GITHUB_WORKSPACE/.github/stubs/advice.rs" "$MEMMAP2_DIR/src/advice.rs"
          echo "memmap2 patched successfully"
      - name: Build release firmware
        run: |
          . $HOME/export-esp.sh
          cd $GITHUB_WORKSPACE
          cargo build --release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: target/xtensa-esp32s3-espidf/release/app_esp32s3
          retention-days: 30
