name: Build ESP32-S3 Firmware

on:
  push:
    branches: [main, ble-web]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip libssl-dev libudev-dev pkg-config

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install espup and ldproxy
        run: cargo +stable install espup ldproxy --locked

      - name: Install ESP32-S3 toolchain
        run: espup install --targets esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone dependency modules
        run: |
          cd $GITHUB_WORKSPACE/..
          git clone https://github.com/dm1366631/AstroBox-NG-Module-Core.git core
          git clone https://github.com/AstralSightStudios/AstroBox-NG-Module-Pb.git pb
          git clone https://github.com/AstralSightStudios/AstroBox-NG-Module-Vivo-MsgPack.git vivo_msgpack


      - name: Patch memmap2 for ESP-IDF (if present)
        run: |
          . $HOME/export-esp.sh
          cd $GITHUB_WORKSPACE
          cargo fetch
          # Patch memmap2 if it is in the dependency tree
          MEMMAP2_DIR=$(find ~/.cargo/registry/src -type d -name "memmap2-0.9*" | head -1)
          if [ -n "$MEMMAP2_DIR" ]; then
            echo "Patching memmap2 at: $MEMMAP2_DIR"
            cp "$GITHUB_WORKSPACE/.github/stubs/unix.rs" "$MEMMAP2_DIR/src/unix.rs"
            cp "$GITHUB_WORKSPACE/.github/stubs/advice.rs" "$MEMMAP2_DIR/src/advice.rs"
            echo "memmap2 patched successfully"
          else
            echo "memmap2 not in dependency tree, skipping"
          fi
          # Patch zip 0.6.6 (corelib dep) for Xtensa
          ZIP_DIR=$(find ~/.cargo/registry/src -type d -name "zip-0.6*" | head -1)
          if [ -n "$ZIP_DIR" ]; then
            echo "Patching zip at: $ZIP_DIR"
            python3 "$GITHUB_WORKSPACE/.github/patch_zip.py" "$ZIP_DIR"
          else
            echo "zip 0.6 not in dependency tree, skipping"
          fi
      - name: Build release firmware
        run: |
          . $HOME/export-esp.sh
          cd $GITHUB_WORKSPACE
          cargo build --release --features webui

      - name: Package firmware binaries (esptool elf2image + merge)
        run: |
          . $HOME/export-esp.sh
          cd $GITHUB_WORKSPACE
          APP_ELF=target/xtensa-esp32s3-espidf/release/app_esp32s3
          if python3 -m esptool --version >/dev/null 2>&1; then
            ESPTOOL=$(python3 -c "import esptool,os;print(os.path.join(os.path.dirname(esptool.__file__),'esptool.py'))")
          elif command -v esptool.py >/dev/null 2>&1; then
            ESPTOOL=$(command -v esptool.py)
          else
            ESPTOOL=$(find "$HOME/.espup" "$HOME/.espressif" /opt -name "esptool.py" 2>/dev/null | head -1)
          fi
          echo "esptool.py: $ESPTOOL"
          # 1) ELF -> app.bin
          python3 "$ESPTOOL" --chip esp32s3 elf2image --flash_mode dio --flash_size 4MB -o app.bin "$APP_ELF"
          # 2) 找 bootloader / partition-table 并合并成单个 firmware.bin
          BL=$(find target -name "bootloader.bin" | head -1)
          PT=$(find target -name "partition-table.bin" | head -1)
          echo "BL=$BL PT=$PT"
          if [ -n "$BL" ] && [ -n "$PT" ]; then
            python3 "$ESPTOOL" --chip esp32s3 merge_bin -o firmware.bin 0x0 "$BL" 0x8000 "$PT" 0x10000 app.bin
          else
            cp app.bin firmware.bin
          fi
          ls -la firmware.bin app.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-ble-web
          path: |
            target/xtensa-esp32s3-espidf/release/app_esp32s3
            firmware.bin
            app.bin
          retention-days: 30
